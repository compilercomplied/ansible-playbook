---
- name: Validate workstation execution context
  ansible.builtin.assert:
    that:
      - workstation_profile in ['work', 'personal']
      - ansible_facts['distribution'] == 'Debian' or ansible_facts['os_family'] == 'Darwin'
      - ansible_facts['user_uid'] | int != 0
      - target_user == ansible_facts['user_id']
      - home_dir == ansible_facts['user_dir']
    fail_msg: Run as the workstation login user on Debian or macOS; use bootstrap.yml for a root-only Debian installation.
  tags: always
