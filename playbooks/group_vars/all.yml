---
workstation_profile: personal
is_gui_enabled: true
install_docker: true
configure_secrets: true
configure_system: true
install_personal_apps: "{{ workstation_profile == 'personal' }}"
configure_touchid_sudo: false
node_version: lts

# Facts describe the account actually running local provisioning, including IT-managed logins.
target_user: "{{ ansible_facts['user_id'] }}"
home_dir: "{{ ansible_facts['user_dir'] }}"
bin_dir: "{{ home_dir }}/.local/bin"
shell_path: "{{ home_dir }}/.cargo/bin/nu"
starship_bin_path: "{{ bin_dir }}/starship"
nushell_config_dir: "{{ home_dir ~ '/Library/Application Support/nushell' if ansible_facts['os_family'] == 'Darwin' else home_dir ~ '/.config/nushell' }}"
