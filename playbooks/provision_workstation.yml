---
- name: Provision the current workstation user
  hosts: workstations
  become: false
  tags: workstation
  pre_tasks:
    - name: Validate workstation execution context
      ansible.builtin.import_tasks: tasks/validate_workstation.yml
      tags: always
    - name: Load platform package lists
      ansible.builtin.include_vars: "{{ playbook_dir }}/vars/{{ ansible_facts['os_family'] }}.yml"
      tags: always
  roles:
    - common
    - toolchains
    - ai_tools
    - terminal
    - editor
    - role: docker
      when: install_docker | bool
    - role: system
      when: configure_system | bool
    - role: gui_apps
      when: is_gui_enabled | bool
