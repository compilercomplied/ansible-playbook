---
- name: Check if mise is installed
  ansible.builtin.stat:
    path: "{{ home_dir }}/.local/bin/mise"
  register: mise_check

- name: Install mise
  ansible.builtin.shell: |
    curl https://mise.run | sh
  when: not mise_check.stat.exists

- name: Add mise to user .bashrc
  ansible.builtin.lineinfile:
    path: "{{ home_dir }}/.bashrc"
    line: 'eval "$(~/.local/bin/mise activate bash)"'
    create: yes
    owner: "{{ target_user }}"

- name: Add mise to user .profile
  ansible.builtin.lineinfile:
    path: "{{ home_dir }}/.profile"
    line: 'eval "$(~/.local/bin/mise activate bash)"'
    create: yes
    owner: "{{ target_user }}"

- name: Activate mise in Zsh
  ansible.builtin.lineinfile:
    path: "{{ home_dir }}/.zshrc"
    line: 'eval "$(~/.local/bin/mise activate zsh)"'
    create: true
  when: ansible_facts['os_family'] == 'Darwin'
