---
- name: Configure toolchains
  when: not ansible_check_mode
  block:
    - name: Install mise
      ansible.builtin.import_tasks: subtasks/mise.yml
    - name: Configure Node through mise
      ansible.builtin.import_tasks: subtasks/nodejs.yml
    - name: Configure Rust
      ansible.builtin.import_tasks: subtasks/rust.yml
    - name: Configure Pulumi
      ansible.builtin.import_tasks: subtasks/pulumi.yml
