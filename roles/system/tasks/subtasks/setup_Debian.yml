---
- name: Install Core Packages (Debian)
  become: true
  ansible.builtin.apt:
    name: "{{ core_packages + (user_packages | default([])) }}"
    state: present
    update_cache: yes

# Kata Containers, monitoring agents (Alloy, Loki), and K3s itself all create many
# inotify watches. The default kernel limits (8192 watches, 128 instances) are too
# low and cause "too many open files" errors across multiple services.
- name: Increase inotify max_user_watches for k8s/containers
  become: true
  ansible.builtin.sysctl:
    name: fs.inotify.max_user_watches
    value: "524288"
    state: present
    reload: yes

- name: Increase inotify max_user_instances for k8s/containers
  become: true
  ansible.builtin.sysctl:
    name: fs.inotify.max_user_instances
    value: "8192"
    state: present
    reload: yes

# Note: This is explicitly for the bare metal cluster (which runs K3s).
# K3s requires a durable IPv6 address on the primary interface to support dual-stack networking,
# which is needed for Node.js services (like Outline Wiki) that default to IPv6 sockets.
- name: Ensure static IPv6 address is configured for bare metal cluster dual-stack
  become: true
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    block: |
      iface enp0s31f6 inet6 static
          address fd00::200/64
    marker: "# {mark} ANSIBLE MANAGED BLOCK - DUAL STACK IPV6"

