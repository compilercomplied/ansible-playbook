---
- name: Configure macOS preferences
  ansible.builtin.import_tasks: subtasks/configure_Darwin.yml
  when: ansible_facts['os_family'] == 'Darwin'

- name: Configure optional Touch ID for sudo
  ansible.builtin.import_tasks: subtasks/setup_Darwin.yml
  when: ansible_facts['os_family'] == 'Darwin' and configure_touchid_sudo | bool
