---
- name: Install Homebrew workstation packages
  community.general.homebrew:
    name: "{{ workstation_packages + (personal_packages if install_personal_apps | bool else []) }}"
    state: present
    update_homebrew: true

- name: Enable Syncthing service
  community.general.homebrew_services:
    name: syncthing
    state: present
  when: install_personal_apps | bool and not ansible_check_mode
