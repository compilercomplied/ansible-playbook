---
- name: Install platform packages
  ansible.builtin.include_tasks: "packages_{{ ansible_facts['os_family'] }}.yml"

- name: Ensure user configuration and binary directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ home_dir }}/.config"
    - "{{ bin_dir }}"

- name: Check Git LFS initialization
  ansible.builtin.command: git config --global filter.lfs.smudge
  register: git_lfs_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Initialize Git LFS
  ansible.builtin.command: git lfs install
  when: git_lfs_check.rc != 0 and not ansible_check_mode

- name: Clone personal secrets
  ansible.builtin.git:
    repo: git@github.com:compilercomplied/secrets.git
    dest: "{{ home_dir }}/secrets"
    version: master
    accept_hostkey: true
    force: false
  when: configure_secrets | bool and not ansible_check_mode
