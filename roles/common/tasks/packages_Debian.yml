---
- name: Install Debian workstation packages
  become: true
  ansible.builtin.apt:
    name: "{{ workstation_packages + (personal_packages if install_personal_apps | bool else []) }}"
    state: present
    update_cache: true

- name: Enable user Syncthing service
  ansible.builtin.systemd:
    name: syncthing
    scope: user
    enabled: true
    state: started
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  when: install_personal_apps | bool and not ansible_check_mode
