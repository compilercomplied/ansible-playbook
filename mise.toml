[tasks.project-setup]
description = "Install Ansible collection dependencies (requires Ansible)"
run = "ansible-galaxy collection install -r requirements.yml"

[tasks.provision-work]
description = "Configure the logged-in user's work laptop"
run = "ansible-playbook site.yml -e workstation_profile=work --ask-become-pass"

[tasks.provision-personal]
description = "Configure the logged-in user's personal laptop"
run = "ansible-playbook site.yml -e workstation_profile=personal --ask-become-pass"

[tasks.bootstrap]
description = "Create the personal Debian login account (run as root)"
run = "ansible-playbook playbooks/bootstrap.yml"

[tasks.check]
description = "Validate playbooks without provisioning"
run = ["ansible-playbook site.yml --syntax-check", "ansible-playbook playbooks/bootstrap.yml --syntax-check", "ansible-playbook tests/profiles.yml"]
